# Alias of compose/prod.yml - stack.sh uses compose/prod.yml.
# Kept so an older command that still passes this file fails closed the same way.

services:
  frontend:
    image: ghcr.io/sarasprzimmer/oxytrip-frontend:${FRONTEND_TAG:?set FRONTEND_TAG to a git SHA}
    pull_policy: always
    user: "0:0"
    volumes:
      - frontend_next_cache:/app/.next/cache

  panel:
    image: ghcr.io/sarasprzimmer/oxytripcms:${PANEL_TAG:?set PANEL_TAG to a git SHA}
    pull_policy: always
    environment:
      PORT: "8080"
      NODE_ENV: production

  edge:
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  frontend_next_cache:
